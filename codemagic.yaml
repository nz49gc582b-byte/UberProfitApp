workflows:
  ios-unsigned-ipa:
    name: Build UberProfitApp V12 (Unsigned IPA for Sideloadly)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen & Generate Project
        script: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen generate
      - name: Build Unsigned Release App & Broadcast Extension
        script: |
          xcodebuild clean build \
            -project UberProfitApp.xcodeproj \
            -scheme UberProfitApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      - name: Package Payload into UberProfitApp_V12.ipa
        script: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "UberProfitApp.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Erro: UberProfitApp.app não encontrado!"
            exit 1
          fi
          cp -R "$APP_PATH" Payload/
          zip -r9 UberProfitApp_V12_Corporativo.ipa Payload
    artifacts:
      - UberProfitApp_V12_Corporativo.ipa
